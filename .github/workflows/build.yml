name: Build

on:
  push:
    branches: [main]
    tags: ['v*']          # v1.2.3 -> package version 1.2.3.0 + GitHub Release
  pull_request:
  workflow_dispatch:

permissions:
  contents: write         # needed to create releases on tags

jobs:
  python:
    name: Python edition (tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (standard library only, no pip install)
        run: python -m unittest discover -s python/tests -v
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: LumenReader-python
          path: |
            python/
            !python/tests/

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (compile check)
        run: dotnet build src/LumenReader/LumenReader.csproj -c Release

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = "0.1.$env:GITHUB_RUN_NUMBER"
          }
          "version=$v.0" >> $env:GITHUB_OUTPUT

      # Store identity values come from repository *variables* (Settings → Secrets and variables → Actions → Variables).
      - name: Package MSIX
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: >
          ./build/pack-msix.ps1
          -Version '${{ steps.ver.outputs.version }}'
          -IdentityName '${{ vars.MSIX_IDENTITY_NAME || 'LumenReader' }}'
          -Publisher '${{ vars.MSIX_PUBLISHER || 'CN=LumenReaderDev' }}'
          -PublisherDisplayName '${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Lumen Reader' }}'

      # Portable build: unzip and run LumenReader.exe, no installation (for testing without the Store).
      # Artifacts get zipped by GitHub, so the folders are uploaded directly; the zips are for releases only.
      - name: Portable zip (for releases)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          foreach ($arch in 'x64','arm64') {
            Compress-Archive -Path "artifacts/publish-$arch/*" -DestinationPath "artifacts/LumenReader-portable-$arch.zip"
          }

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: LumenReader-portable-x64
          path: artifacts/publish-x64/

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: LumenReader-portable-arm64
          path: artifacts/publish-arm64/

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: LumenReader-msix-${{ steps.ver.outputs.version }}
          path: |
            artifacts/*.msixupload
            artifacts/*.msixbundle

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.msixupload
            artifacts/LumenReader-portable-*.zip
          generate_release_notes: true
