<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lumen Reader</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body data-theme="light">
  <header class="toolbar">
    <button id="btnHome" class="tb"><span class="ic">&#xE80F;</span></button>
    <button id="btnOpen" class="tb tb-text"><span class="ic">&#xE8E5;</span><span id="lblOpen"></span></button>
    <button id="btnToc" class="tb"><span class="ic">&#xE8FD;</span></button>
    <span class="sep"></span>
    <button id="btnPrev" class="tb" disabled><span class="ic">&#xE76B;</span></button>
    <button id="btnNext" class="tb" disabled><span class="ic">&#xE76C;</span></button>
    <div id="docTitle" class="doc-title"></div>
    <button id="btnFind" class="tb"><span class="ic">&#xE721;</span></button>
    <div class="themes" role="radiogroup">
      <button class="tb theme" data-theme="light"><span class="ic">&#xE706;</span></button>
      <button class="tb theme" data-theme="dark"><span class="ic">&#xE708;</span></button>
      <button class="tb theme" data-theme="reading"><span class="ic">&#xE736;</span></button>
    </div>
    <span class="sep"></span>
    <button id="btnFull" class="tb"><span class="ic">&#xE740;</span></button>
    <span class="ic globe">&#xE774;</span>
    <select id="lang"></select>
  </header>

  <main class="layout">
    <aside id="toc" class="toc">
      <div class="tabs">
        <button id="tabContents" class="tab on"></button>
        <button id="tabNotes" class="tab"><span id="tabNotesLabel"></span> <span id="notesCount" class="count"></span></button>
      </div>
      <div id="panelContents">
        <p id="noToc" class="muted" hidden></p>
        <nav id="tocTree"></nav>
      </div>
      <div id="panelNotes" hidden>
        <p id="noNotes" class="muted"></p>
        <div id="notesList"></div>
        <div id="wordInfo" class="word-info" hidden></div>
      </div>
    </aside>
    <div id="splitter" class="splitter"></div>
    <section class="content">
      <iframe id="view" title="document" hidden></iframe>
      <div id="rail" class="rail" hidden></div>
      <div id="find" class="find" hidden>
        <span class="ic">&#xE721;</span>
        <input id="findInput" type="search" autocomplete="off" spellcheck="false">
        <span id="findCount" class="find-count"></span>
        <button id="findPrev" class="tb"><span class="ic">&#xE70E;</span></button>
        <button id="findNext" class="tb"><span class="ic">&#xE70D;</span></button>
        <button id="findClose" class="tb"><span class="ic">&#xE711;</span></button>
      </div>
      <div id="welcome" class="welcome"></div>
      <div id="busy" class="busy" hidden><div class="spinner"></div><span id="busyText"></span></div>
      <footer id="status" class="status" hidden>
        <span id="statusText"></span>
        <div class="bar"><div id="statusBar"></div></div>
      </footer>
    </section>
  </main>

  <!-- shown above a text selection in the document -->
  <div id="selPopup" class="popup sel-popup" hidden>
    <button class="dot" data-color="yellow"></button>
    <button class="dot" data-color="green"></button>
    <button class="dot" data-color="blue"></button>
    <button class="dot" data-color="pink"></button>
    <span class="sep"></span>
    <button id="selNote" class="tb"><span class="ic">&#xE70B;</span></button>
  </div>

  <!-- note editor for a highlight -->
  <div id="editor" class="popup editor" hidden>
    <div class="quote" id="edQuote"></div>
    <textarea id="edNote" rows="4"></textarea>
    <div class="row">
      <button class="dot" data-color="yellow"></button>
      <button class="dot" data-color="green"></button>
      <button class="dot" data-color="blue"></button>
      <button class="dot" data-color="pink"></button>
      <span class="grow"></span>
      <button id="edDelete" class="tb"><span class="ic">&#xE74D;</span></button>
      <button id="edClose" class="btn"></button>
    </div>
  </div>

  <div id="hotzone" class="hotzone"></div>
  <div id="drop" class="drop" hidden><div id="dropText"></div></div>
  <div id="toast" class="toast" hidden></div>
  <input type="file" id="fileInput" hidden>
  <input type="file" id="restoreInput" accept=".json,application/json" hidden>
  <script src="app.js"></script>
</body>
</html>
